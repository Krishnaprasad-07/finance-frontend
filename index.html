<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview — Fintrack</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="sidebar-overlay"></div>

<div class="shell">

  <!-- Sidebar (injected by layout.js) -->
  <aside class="sidebar" id="sidebar-mount"></aside>

  <div class="main">

    <!-- Topbar (injected by layout.js) -->
    <header class="topbar" id="topbar-mount"></header>

    <div class="content">

      <!-- Summary Cards -->
      <div class="section-title">Summary</div>
      <div class="cards-row">
        <div class="card">
          <div class="card-icon blue">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
          </div>
          <div class="card-label">Total Balance</div>
          <div class="card-value" id="card-balance">—</div>
          <div class="card-sub" id="diff-balance"></div>
        </div>
        <div class="card">
          <div class="card-icon green">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
            </svg>
          </div>
          <div class="card-label">Total Income</div>
          <div class="card-value" id="card-income">—</div>
          <div class="card-sub" id="diff-income"></div>
        </div>
        <div class="card">
          <div class="card-icon red">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>
            </svg>
          </div>
          <div class="card-label">Total Expenses</div>
          <div class="card-value" id="card-expense">—</div>
          <div class="card-sub" id="diff-expense"></div>
        </div>
        <div class="card">
          <div class="card-icon amber">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
            </svg>
          </div>
          <div class="card-label">Savings Rate</div>
          <div class="card-value" id="card-savings">—</div>
          <div class="card-sub" id="diff-savings"></div>
        </div>
      </div>

      <!-- Charts -->
      <div class="section-title">Trends &amp; Breakdown</div>
      <div class="charts-row">

        <div class="chart-card">
          <div class="chart-header">
            <div>
              <div class="chart-title">Income vs Expenses</div>
              <div class="chart-sub">Monthly overview</div>
            </div>
            <div style="display:flex;gap:12px;font-size:12px;color:var(--text-3)">
              <span style="display:flex;align-items:center;gap:5px">
                <span style="width:9px;height:9px;border-radius:2px;background:#1d8f6a;display:inline-block"></span>Income
              </span>
              <span style="display:flex;align-items:center;gap:5px">
                <span style="width:9px;height:9px;border-radius:2px;background:#c94040;display:inline-block"></span>Expenses
              </span>
            </div>
          </div>
          <div class="chart-canvas-wrap">
            <canvas id="trendChart"></canvas>
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-header">
            <div>
              <div class="chart-title">Spending by Category</div>
              <div class="chart-sub">This month</div>
            </div>
          </div>
          <div class="donut-wrap">
            <canvas id="donutChart"></canvas>
          </div>
          <div class="donut-legend" id="donutLegend"></div>
        </div>

      </div>

    </div><!-- /content -->
  </div><!-- /main -->
</div><!-- /shell -->

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
